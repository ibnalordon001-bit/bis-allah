
name: Build and Sign FocusLock APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Detect project and signing key
        shell: bash
        run: |
          if [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          elif [ -f "FocusLock/settings.gradle.kts" ]; then
            PROJECT_DIR="FocusLock"
          else
            echo "ERROR: FocusLock Gradle project not found"
            exit 1
          fi

          KEYSTORE="$PROJECT_DIR/app/focuslock.keystore"

          echo "Project directory: $PROJECT_DIR"

          if [ ! -f "$KEYSTORE" ]; then
            echo "ERROR: Signing keystore not found: $KEYSTORE"
            echo "Available keystore files:"
            find . -name "*.keystore" -o -name "*.jks"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Verify signing key
        shell: bash
        run: |
          keytool -list -v \
            -keystore "$KEYSTORE" \
            -alias focuslock \
            -storepass focuslock123 \
            -keypass focuslock123

      - name: Build signed APK
        shell: bash
        run: |
          gradle -p "$PROJECT_DIR" \
            :app:assembleDebug \
            --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/FocusLock-signed.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-signed-APK
          path: FocusLock-signed.apk
          if-no-files-found: error
          
