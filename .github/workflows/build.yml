
name: Build and Sign FocusLock APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify signing key
        run: |
          test -f app/focuslock.keystore

          keytool -list -v \
            -keystore app/focuslock.keystore \
            -alias focuslock \
            -storepass focuslock123 \
            -keypass focuslock123

      - name: Build signed APK
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          "$APKSIGNER" verify --print-certs "$APK" \
            | grep -Fqi \
            "D9:89:51:C0:1E:EF:05:8E:9B:65:62:50:50:F0:90:0D:35:1F:86:A9:BD:90:59:F5:8C:C7:91:63:83:05:CB:0A"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-signed-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
