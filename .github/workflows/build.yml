
name: Build and Sign FocusLock APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find FocusLock project
        shell: bash
        run: |
          PROJECT_DIR=""

          while IFS= read -r FILE; do
            DIR="${FILE%/settings.gradle.kts}"

            if [ "$DIR" = "$FILE" ]; then
              DIR="${FILE%/settings.gradle}"
            fi

            if [ -f "$DIR/app/build.gradle.kts" ] && \
               [ -f "$DIR/app/focuslock.keystore" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find . -type f \( \
              -name settings.gradle.kts -o \
              -name settings.gradle \
            \)
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: FocusLock project or keystore not found"
            echo "Repository files:"
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"
          echo "Found keystore: $PROJECT_DIR/app/focuslock.keystore"

      - name: Verify signing key
        shell: bash
        run: |
          keytool -list -v \
            -keystore "$PROJECT_DIR/app/focuslock.keystore" \
            -alias focuslock \
            -storepass focuslock123 \
            -keypass focuslock123

      - name: Build APK
        shell: bash
        run: |
          gradle -p "$PROJECT_DIR" \
            :app:assembleDebug \
            --no-daemon

      - name: Verify APK signature
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not generated"
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          "$APKSIGNER" verify --print-certs "$APK" \
            | grep -Fqi \
            "D9:89:51:C0:1E:EF:05:8E:9B:65:62:50:50:F0:90:0D:35:1F:86:A9:BD:90:59:F5:8C:C7:91:63:83:05:CB:0A"

          echo "APK signature verified successfully"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-signed-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
